name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Verify version markers match tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          EXPECTED="${TAG#v}"

          VERSION_FILE=$(tr -d '[:space:]' < intern-os/VERSION)
          if [ "$VERSION_FILE" != "$EXPECTED" ]; then
            echo "ERROR: intern-os/VERSION is '$VERSION_FILE', expected '$EXPECTED' (from tag $TAG)"
            exit 1
          fi

          SKILL_VERSION=$(awk -F': *' '/^version: / { print $2; exit }' intern-os/SKILL.md | tr -d '[:space:]')
          if [ "$SKILL_VERSION" != "$EXPECTED" ]; then
            echo "ERROR: intern-os/SKILL.md version: is '$SKILL_VERSION', expected '$EXPECTED' (from tag $TAG)"
            exit 1
          fi

          echo "Version markers match tag $TAG"

      - name: Extract release notes from CHANGELOG.md
        run: |
          bash intern-os/scripts/extract-changelog.sh "${{ steps.version.outputs.tag }}" > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "ERROR: No CHANGELOG.md entry found for ${{ steps.version.outputs.tag }}"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md
