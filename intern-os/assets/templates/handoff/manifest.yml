---
# Handoff manifest — fill the placeholders before spawning the specialist.
# Schema: intern-os/schemas/handoff-v1.yaml
# Spec:   docs/specs/v0.4.0-isolated-handoff.md

internos_handoff: v1

handoff_id: 2026-01-01-1200-replace-me
project: <project-name>
workstream: <workstream-name>
workstream_path: /absolute/path/to/projects/<project>/workstreams/<workstream>
thread_id: <platform>:<id>

role: <specialist-role>

load:
  required:
    - BRIEF.md
    - STATUS.md
  optional: []

task:
  objective: |
    <what the specialist must do>
  success_condition: |
    <observable condition that means the task is done>
  stop_condition:
    - success condition met
    - binding_check fails (return aborted-binding-mismatch)
    - blocked by a question only the human can answer (record and stop)

binding_checks:
  - workstream_path_exists
  - brief_md_exists
  - thread_id_matches
  - load_required_paths_exist

write_back:
  artifact_path: handoffs/2026-01-01-1200-replace-me.md
  artifact_schema:
    - objective
    - work
    - findings
    - open-questions
    - status
  also_append: []

isolation:
  - do not read sibling workstreams
  - do not modify files outside workstream_path
  - do not modify BRIEF.md, STATUS.md, or DECISIONS.md
